name: publicos_client
description: "PublicOS Client - A decentralized operating system for public identities"
publish_to: 'none'
version: 1.0.0+108

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  # First-party localization delegates (gen-l10n). SDK source, not pub.dev.
  flutter_localizations:
    sdk: flutter

  # PublicOS Core
  publicos_core:
    git:
      url: https://github.com/PublicOS-dev/PublicOS_Core.git

  # The website-to-wallet bridge: EIP-1193 provider, request dispatch, the
  # connect-grant gate and the signing path. Shared with publicos_desktop so
  # the signing path exists exactly once.
  publicos_web3_bridge:
    git:
      url: https://github.com/PublicOS-dev/publicos_web3_bridge.git

  cupertino_icons: ^1.0.8
  wallet: ^0.0.18
  shared_preferences: ^2.3.5
  zero_cached_image: ^1.5.0
  zero_cached_video: ^0.2.0
  zero_cached_thumbnail: ^0.1.0
  # Mention machinery (controller + parser + trigger); not on pub.dev, a git
  # dependency.
  zero_mentions:
    git:
      url: https://github.com/PublicOS-dev/zero_mentions.git
  # Used directly by NaturalRatioMedia for video aspect-ratio probing;
  # also a transitive dep through zero_cached_video.
  video_player: ^2.9.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  # On-chain NFT art is often inline SVG (data:image/svg+xml); flutter_svg
  # renders it. Used only by the NftImage wrapper. (Raster data: URIs use
  # Image.memory; http/ipfs URLs stay on ZeroCachedImage's disk cache.)
  flutter_svg: ^2.0.17
  image_picker: ^1.1.2
  # Already transitive deps of image_picker; declared direct only so we can call
  # ImagePickerAndroid.useAndroidPhotoPicker = true (the modern Photo Picker,
  # which shows images+videos ONLY — the legacy GET_CONTENT fallback leaks all
  # files on some devices). Standard image_picker README pattern.
  image_picker_android: ^0.8.13
  image_picker_platform_interface: ^2.11.0
  flutter_image_compress: ^2.3.0
  webview_flutter: ^4.7.0
  share_plus: ^7.2.2
  # Native open-file dialog with .xmtpBak extension filter for the XMTP
  # backup-restore flow. flutter.dev verified. Save-side uses share_plus
  # (file_selector has no Android/iOS save support).
  file_selector: ^1.1.0
  intl: ^0.20.2
  http: ^1.2.2
  web3dart: ^3.0.2
  webview_flutter_android: ^4.10.1
  webview_flutter_wkwebview: ^3.23.0
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^18.0.1
  go_router: ^14.8.1
  gal: ^2.3.2
  path_provider: ^2.1.5
  # Reads the running build's version/buildNumber for the in-app version label.
  package_info_plus: ^8.0.0
  # Used by NaturalRatioMedia to sha256-key temp files for video-bytes probing
  # (matches the keying ZeroBytesVideo uses upstream — same temp path is reused).
  crypto: ^3.0.3
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  google_mlkit_translation: ^0.13.1
  google_mlkit_language_id: ^0.13.1
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Permanent: these packages iterate alongside the client, and we don't want a
# pub.dev publish per tweak. Published versions are for external consumers;
# the client always builds against the git repos. Do NOT strip when published.
dependency_overrides:
  # zero_video_android: the Android video plugin with ONE change,
  # MP4 edit lists ignored in the extractor, because the Pixel's Tensor decoder
  # stalls 6-60 s on the double flush media3 does at every loop wrap of an
  # ffmpeg export (media3 1.11.1 did not fix it). Vendored fork, PERMANENT,
  # package name unchanged (video_player resolves implementations by name).
  video_player_android:
    git:
      url: https://github.com/PublicOS-dev/zero_video_android.git
  zero_cached_video:
    git:
      url: https://github.com/PublicOS-dev/zero_cached_video.git
  zero_cached_thumbnail:
    git:
      url: https://github.com/PublicOS-dev/zero_cached_thumbnail.git
  # Webview storage profiles: per-account engine storage needs a
  # plugin change on each mobile engine (Profile API / WKWebsiteDataStore),
  # unreachable from outside the plugin. Vendored forks, PERMANENT, package
  # names unchanged because webview_flutter resolves implementations by name.
  webview_flutter_android:
    git:
      url: https://github.com/PublicOS-dev/zero_webview_android.git
  webview_flutter_wkwebview:
    git:
      url: https://github.com/PublicOS-dev/zero_webview_wkwebview.git

flutter:
  # Enables gen-l10n: builds AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true
  uses-material-design: true

  assets:
    - assets/discover/catalogue.json
    - assets/xmtp.jpg
    - assets/system_apps/
    # Onboarding outro art. Bundled rather than fetched: these are the same
    # images the Tequio app tile and the publicos org profile load from the
    # network, but the outro is the last thing between the user and the app,
    # so it must never render a hole on a cold first launch.
    - assets/onboarding/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
